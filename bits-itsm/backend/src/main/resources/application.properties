spring.application.name=BITSolve
server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5432/bitsolve
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
# Set SESSION_COOKIE_SECURE=true when deploying behind HTTPS.
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
